<!DOCTYPE html>
<html>
  <head>
    {% block head %}
    <title>{{ title|default:"Redoc" }}</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&family=Roboto:wght@300;400;700&display=swap">
    <style>
      {# Redoc doesn't change outer page styles. #}
      body { margin: 0; padding: 0; }
    </style>
    {% endblock head %}
  </head>
  <body>
    {% block body %}
    {% if settings %}
    <div id="redoc-container"></div>
    <script src="{{ redoc_standalone }}"></script>
    <script>
      const redocSettings = {{ settings|safe }};
      Redoc.init("{{ schema_url }}", redocSettings, document.getElementById('redoc-container'))
    </script>
    {% else %}
    <redoc spec-url="{{ schema_url }}"></redoc>
    <script src="{{ redoc_standalone }}"></script>
    {% endif %}
    {% endblock body %}
    <script>
      (function() {
        var timer;
        function applyRtlSupport() {
          var els = document.querySelectorAll('p, h1, h2, h3, h4, h5, h6, input, textarea');
          for (var i = 0; i < els.length; i++) {
            if (!els[i].hasAttribute('dir')) {
              els[i].setAttribute('dir', 'auto');
            }
            els[i].style.textAlign = 'justify';
          }
        }
        applyRtlSupport();
        new MutationObserver(function() {
          clearTimeout(timer);
          timer = setTimeout(applyRtlSupport, 100);
        }).observe(document.body, { childList: true, subtree: true });
      })();
    </script>
  </body>
</html>
