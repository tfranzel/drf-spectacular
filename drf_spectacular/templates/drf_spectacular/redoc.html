<!DOCTYPE html>
<html>
  <head>
    {% block head %}
    <title>{{ title|default:"Redoc" }}</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&family=Roboto:wght@300;400;700&display=swap">
    <style>
      {# Redoc doesn't change outer page styles. #}
      body { margin: 0; padding: 0; }
    </style>
    {% endblock head %}
  </head>
  <body>
    {% block body %}
    <div id="redoc-container"></div>
    <script type="module">
      const Redoc = await import("{{ redoc_standalone|escapejs }}").catch(() => new Promise((resolve, reject) => {
        // Redoc v2 bundles require a classic script and expose a global instead of module exports.
        const script = document.createElement('script');
        script.src = "{{ redoc_standalone|escapejs }}";
        script.onload = () => resolve(window.Redoc);
        script.onerror = reject;
        document.head.appendChild(script);
      }));
      const redocSettings = {{ settings|default:"{}"|safe }};
      Redoc.init("{{ schema_url|escapejs }}", redocSettings, document.getElementById('redoc-container'))
    </script>
    {% endblock body %}
  </body>
</html>
