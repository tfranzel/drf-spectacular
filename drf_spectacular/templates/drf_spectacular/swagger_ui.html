<!DOCTYPE html>
<html>
  <head>
    {% block head %}
    <title>{{ title|default:"Swagger" }}</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% if favicon_href %}<link rel="icon" href="{{ favicon_href }}">{% endif %}
    <link rel="stylesheet" href="{{ swagger_ui_css }}">
    <style>
      html { box-sizing: border-box; overflow-y: scroll; }
      *, *:after, *:before { box-sizing: inherit; }
      body { background: #fafafa; margin: 0; }
    </style>
    {% endblock head %}
  </head>
  <body>
    {% block body %}
    <div id="swagger-ui"></div>
    <script src="{{ swagger_ui_bundle }}"></script>
    <script src="{{ swagger_ui_standalone }}"></script>
    {% if script_url %}
    <script src="{{ script_url }}"></script>
    {% else %}
    <script>
    {% include template_name_js %}
    </script>
    {% endif %}
    {% endblock %}
    <script>
      (function() {
        var timer;
        function applyRtlSupport() {
          var els = document.querySelectorAll('p, h1, h2, h3, h4, h5, h6, input, textarea');
          for (var i = 0; i < els.length; i++) {
            if (!els[i].hasAttribute('dir')) {
              els[i].setAttribute('dir', 'auto');
            }
            els[i].style.textAlign = 'justify';
          }
        }
        applyRtlSupport();
        new MutationObserver(function() {
          clearTimeout(timer);
          timer = setTimeout(applyRtlSupport, 100);
        }).observe(document.body, { childList: true, subtree: true });
      })();
    </script>
  </body>
</html>
